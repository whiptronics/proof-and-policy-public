# Tagged release: build from the pinned inputs, validate, package, checksum, attach to a GitHub release.
# Runs only on tags pushed by maintainers (v*). Uses the default GITHUB_TOKEN with contents: write.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps -e .
      # If upstream bytes changed since they were pinned, fetch reports changed_upstream and the build
      # step below stops because the pinned bytes are unavailable: re-pin through a reviewed pull request.
      # le.utah.gov omits its intermediate certificate; on Linux those pages may need import-asset.
      - name: Fetch pinned inputs
        run: alcohol-data fetch --config config/builds/preview.yaml
      - name: Build, validate, package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          alcohol-data build --config config/builds/preview.yaml
          alcohol-data validate --profile release
          alcohol-data package --version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify checksums
        run: cd "dist/$VERSION" && sha256sum --check checksums.sha256
      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/$VERSION"
          zip -r docs-and-examples.zip docs examples
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease \
            csv.zip parquet.zip alcohol_data.duckdb manifest.json checksums.sha256 docs-and-examples.zip
