# Manual source refresh: re-download every input, report upstream changes, rebuild,
# validate, and upload the reports for review. It never moves pins or publishes; a
# maintainer reviews the artifacts and opens a pull request with any accepted pin update.
name: source-refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps -e .
      - name: Fetch pinned inputs, then re-download to detect upstream changes
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          alcohol-data fetch --config config/builds/preview.yaml || true
          alcohol-data fetch --config config/builds/preview.yaml --refresh 2>&1 | tee refresh.log || true
      - name: Re-discover Utah Code versions (new versions appear as a diff to review)
        run: |
          alcohol-data legal discover-utah || true
          git diff -- config/sources/utah_code_history.yaml > legal-discovery.diff || true
      - name: Build and validate pinned inputs
        run: |
          alcohol-data build --config config/builds/preview.yaml
          alcohol-data validate --profile release || true
          alcohol-data report coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-report
          path: |
            refresh.log
            legal-discovery.diff
            data/processed/validation_report.md
            docs/coverage-report.md
          retention-days: 30
