[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alcohol-policy-revenue-data"
version = "0.3.1"
description = "Reproducible, source-traceable U.S. alcohol policy, consumption, behavior, and public-revenue data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ethan Whipple" }]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "truststore>=0.9",
  # IANA time-zone data for zoneinfo (Windows has none built in); used for the as-of cutoff.
  "tzdata>=2024.1",
  # Text of the Utah Digests of Legislation (session inventory); pure Python.
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only needed to render PDF pages when reviewing manual extractions.
pdf = ["pdfplumber>=0.11"]

[project.scripts]
alcohol-data = "alcohol_data.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alcohol_data = ["exports/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
