# Nationwide policy baseline, batch 5: the Northeast. Each entry is a dated snapshot of what the cited text
# shows on the day it was read, or on the date or year the source states; nothing here covers other days.
# support: explicit_text (default) | no_outlet_restriction | indirect (see batch_02_west.yaml).
#
# Not in this batch, and why (see data/curated/research/source_leads.csv):
#   New York: nysenate.gov law pages answered HTTP 403 to an automated request (not worked around).
#   New Jersey: the Division of Alcoholic Beverage Control licensing page answered HTTP 403.
#   Pennsylvania: the Liquor Control Board's wine expanded permit page carries no permit text in its bytes;
#     the Liquor Code itself is needed (lead_pa_act39_2016).
#   Rhode Island grocery permissions: the Class A rule bars other business in cities and towns of 10,000 or
#     more but lets bona fide markets in Newport hold one, and the rule for smaller towns was not checked.
#   Vermont spirits retail system: the agency-store provisions were not located in this pass.
batch: batch_05_northeast
extracted_by: Claude (AI assistant); excerpts cut from the pinned bytes by scripts/policy_snapshots.py
extracted_on: "2026-10-08"
