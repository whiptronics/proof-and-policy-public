  # ------------------------------------------------------------------ Connecticut (2026 Supplement)
  - id: base_ct_grocery_beer
    geo_id: "state:09"
    dimension: ordinary_grocery_beer_authorization
    value: authorized
    detail: Grocery store beer permit.
    asset:
      asset_id: law_ct_cgs_2026_sup_ch545
      url: https://www.cga.ct.gov/2026/sup/chap_545.htm
      edition: "Connecticut General Statutes, 2026 Supplement (revised to January 1, 2026), chapter 545 Liquor Control Act, sections amended in 2025"
      rights_status: government_edict
    citation: Conn. Gen. Stat. § 30-20(c) (2026 Supp.)
    locator: section 30-20, subsection (c)
    find:
      - "This 2026 Supplement is intended to be used in conjunction with the General Statutes of Connecticut, revised to January 1, 2025."
      - "(c) A grocery store beer permit may be granted to any grocery store and shall allow the retail sale of beer in standard size containers not to be consumed on the permit premises."
    observed_on: "2026-01-01"
    observed_basis: currency_statement
    evidence_strength: current_code
    notes: >-
      Section 30-20 was amended in 2025 (P.A. 25-51), so the main chapter page (revised to January 1, 2025) is
      not used. Changes from the 2026 session are not reflected.
  - id: base_ct_grocery_wine
    geo_id: "state:09"
    dimension: ordinary_grocery_wine_authorization
    value: not_authorized
    detail: The grocery store permit covers beer only, and a package store (which sells wine and spirits) may sell no commodity other than alcoholic liquor and listed exceptions.
    asset: law_ct_cgs_2026_sup_ch545
    citation: Conn. Gen. Stat. § 30-20(b)(2) and (c) (2026 Supp.)
    locator: section 30-20, subsections (b)(2) and (c)
    find:
      - "(c) A grocery store beer permit may be granted to any grocery store and shall allow the retail sale of beer in standard size containers not to be consumed on the permit premises."
      - "(2) No store operating under a package store permit shall sell any commodity other than alcoholic liquor except"
    observed_on: "2026-01-01"
    observed_basis: currency_statement
    evidence_strength: current_code
    support: indirect
    notes: That a grocery store therefore cannot sell wine follows from the two provisions together; neither says so in words.
  - id: base_ct_grocery_spirits
    geo_id: "state:09"
    dimension: ordinary_grocery_spirits_authorization
    value: not_authorized
    detail: Same reasoning as wine.
    asset: law_ct_cgs_2026_sup_ch545
    citation: Conn. Gen. Stat. § 30-20(b)(2) and (c) (2026 Supp.)
    locator: section 30-20, subsections (b)(2) and (c)
    find:
      - "(c) A grocery store beer permit may be granted to any grocery store and shall allow the retail sale of beer in standard size containers not to be consumed on the permit premises."
      - "(2) No store operating under a package store permit shall sell any commodity other than alcoholic liquor except"
    observed_on: "2026-01-01"
    observed_basis: currency_statement
    evidence_strength: current_code
    support: indirect
  - id: base_ct_spirits_retail
    geo_id: "state:09"
    dimension: spirits_off_premise_retail_system
    value: private_licensed
    detail: Privately held package store permits.
    asset: law_ct_cgs_2026_sup_ch545
    citation: Conn. Gen. Stat. § 30-20(b)(1) (2026 Supp.)
    locator: section 30-20, subsection (b)(1)
    find: "(b) (1) A package store permit shall allow the retail sale of alcoholic liquor in sealed bottles or containers not to be consumed on the permit premises."
    observed_on: "2026-01-01"
    observed_basis: currency_statement
    evidence_strength: current_code
