  # ------------------------------------------------------------------ Massachusetts
  - id: base_ma_grocery_wine
    geo_id: "state:25"
    dimension: ordinary_grocery_wine_authorization
    value: authorized
    detail: Local licensing authorities may grant off-premises licenses (all alcoholic beverages, or wines and malt beverages only) in cities and towns that vote for them; no outlet type is named or excluded.
    asset:
      asset_id: law_ma_gl_138_15
      url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXX/Chapter138/Section15
      edition: "Massachusetts General Laws chapter 138 § 15, Massachusetts Legislature page"
      filename: ma_gl_138_15.html
      rights_status: government_edict
    citation: M.G.L. c. 138, § 15
    locator: first paragraph
    find: "The local licensing authorities in any city or town which votes to authorize the granting of licenses for the sale of all alcoholic beverages, and such authorities in any city or town which votes to authorize the granting of licenses for the sale of wines and malt beverages only, may grant licenses for the sale at retail of such alcoholic beverages or wines and malt beverages, as the case may be, not to be drunk on the premises"
    evidence_strength: current_code
    support: no_outlet_restriction
    notes: The same section caps how many such licenses one person or company may hold (not excerpted); the city or town vote is a general local option.
