  - id: base_il_grocery_wine
    geo_id: "state:17"
    dimension: ordinary_grocery_wine_authorization
    value: authorized
    detail: The retailer's license covers retail sale of alcoholic liquor; no outlet type is named or excluded.
    asset:
      asset_id: law_il_235_ilcs_5_5_1
      url: https://www.ilga.gov/Documents/legislation/ilcs/documents/023500050K5-1.htm
      edition: "235 ILCS 5/5-1 (Liquor Control Act, kinds of licenses), Illinois General Assembly page"
      rights_status: government_edict
    citation: 235 ILCS 5/5-1(d)
    locator: paragraph (d)
    find: "(d) A retailer's license shall allow the licensee to sell and offer for sale at retail, in or from the premises specified in the license, alcoholic liquor for use or consumption, but not for resale in any form except as otherwise provided in this Act."
    evidence_strength: current_code
    support: no_outlet_restriction
    notes: Local liquor control commissioners also license retailers, and localities may prohibit sales under the Act's local option; neither is coded here.
