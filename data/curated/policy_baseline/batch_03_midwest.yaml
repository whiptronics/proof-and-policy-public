  - id: base_mn_grocery_wine
    geo_id: "state:27"
    dimension: ordinary_grocery_wine_authorization
    value: not_authorized
    detail: Off-sale intoxicating liquor licenses go to exclusive liquor stores; a general food store may hold one only in a city of the first class and only if it held one on 1989-08-01.
    asset:
      asset_id: law_mn_ch_340a
      url: https://www.revisor.mn.gov/statutes/cite/340A/full
      edition: "Minnesota Statutes 2025, chapter 340A (full text), Office of the Revisor of Statutes page"
      filename: mn_340a_full.html
      rights_status: government_edict
    citation: Minn. Stat. § 340A.405, subd. 1
    locator: subdivision 1, paragraphs (a) and (b)
    find:
      - "(a) A city other than a city of the first class may issue with the approval of the commissioner, an off-sale intoxicating liquor license to an exclusive liquor store, or to a drugstore to which an off-sale license had been issued on or prior to May 1, 1994."
      - "(b) A city of the first class may issue an off-sale license to an exclusive liquor store, a general food store to which an off-sale license had been issued on August 1, 1989, or a drugstore to which an off-sale license had been issued on or prior to May 1, 1994."
    evidence_strength: current_code
    notes: >-
      Wine is intoxicating liquor in Minnesota. Grandfathered general food stores in first-class cities are an
      exception to the value, not an ordinary route. The page lists the sections amended in the 2026 session;
      340A.405 and 340A.601 are not among them.
