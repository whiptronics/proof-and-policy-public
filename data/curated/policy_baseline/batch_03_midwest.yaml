# Nationwide policy baseline, batch 3: the Midwest. Each entry is a dated snapshot of what the cited text
# shows on the day it was read (or the date or year the source states); nothing here covers other days.
# support: explicit_text (default) | no_outlet_restriction | indirect (see batch_02_west.yaml).
#
# Not in this batch, and why (see data/curated/research/source_leads.csv):
#   Indiana: the official code site (iga.in.gov) serves statute text by script; the Alcohol and Tobacco
#     Commission's "Alcohol Permits 101" guide does not say which beverages each dealer permit covers.
#   Ohio spirits retail system: the statute (R.C. 4301.17) allows "state liquor stores or agencies"; that
#     every outlet is now a contract agency needs an official Division of Liquor Control statement.
#   South Dakota grocery permissions: the license schedule (SDCL 35-4-2) lists classes without saying which
#     outlets hold them; the definitions in SDCL 35-1-1 are needed.
batch: batch_03_midwest
extracted_by: Claude (AI assistant); excerpts cut from the pinned bytes by scripts/policy_snapshots.py
extracted_on: "2026-10-08"
