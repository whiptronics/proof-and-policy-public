  # ------------------------------------------------------------------ Kansas
  - id: base_ks_grocery_wine
    geo_id: "state:20"
    dimension: ordinary_grocery_wine_authorization
    value: not_authorized
    detail: Wine and spirits are sold off-premises under the retailer's (liquor store) license, whose holder's sales of other goods may not exceed 20% of gross sales, which a grocery store cannot meet.
    asset:
      asset_id: law_ks_41_308
      url: https://www.ksrevisor.gov/statutes/chapters/ch41/041_003_0008.html
      edition: "Kansas Statutes Annotated 41-308 (Retailer's license; rights of licensee), Office of Revisor of Statutes page"
      rights_status: government_edict
    citation: K.S.A. 41-308
    locator: subsections (a) and (c)(7)
    find:
      - "a retailer's license shall allow the licensee to sell and offer for sale at retail and deliver in the original package, as therein prescribed, alcoholic liquor and cereal malt beverage for use or consumption off and away from the premises specified in such license"
      - "(7) sell any other good or service on the licensed premises, except that the gross sales of other goods and services, excluding fees derived from the sale of lottery tickets and revenues from sales of cigarettes and tobacco products, shall not exceed 20% of the retailer's total gross sales"
    evidence_strength: current_code
    support: indirect
    notes: >-
      The conclusion that a grocery store cannot hold this license follows from the 20% cap; the excerpt does not
      say so in words, and does not by itself show that no other license allows wine. Grocery stores may sell
      beer up to 6% alcohol (base_ks_grocery_beer).
