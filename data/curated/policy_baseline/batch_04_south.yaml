    citation: Fla. Stat. § 563.02(1)(a)
    locator: subsection (1)(a)
    find: "Each vendor of malt beverages containing alcohol of 0.5 percent or more by volume shall pay an annual state license tax as follows: (a) Vendors operating places of business where beverages are sold only for consumption off the premises"
