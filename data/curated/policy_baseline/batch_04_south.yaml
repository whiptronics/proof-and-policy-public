  - id: base_wv_spirits_retail
    geo_id: "state:54"
    dimension: spirits_off_premise_retail_system
    value: private_licensed
    detail: Liquor is sold by retail licensees; the state must close its own stores in any market zone where a licensed outlet operates.
    asset:
      asset_id: law_wv_code_60_3a_3
      url: https://code.wvlegislature.gov/60-3A-3/
      edition: "West Virginia Code § 60-3A-3 (Sale of liquor by retail licensees), Legislature page"
      filename: wv_code_60_3a_3.html
      rights_status: government_edict
    citation: W. Va. Code § 60-3A-3
    locator: subsections (a) and (b)
    find:
      - "(a) Notwithstanding any provision of this code to the contrary, the sale of liquor by retail licensees in accordance with the provisions of this article is lawful."
      - "(b) Upon the opening of a retail outlet in any market zone, the state shall, as soon as practicable, discontinue operating any and all state liquor stores and agency stores within the market zone so long as a retail outlet is in operation in the market zone."
    evidence_strength: current_code
    support: indirect
    notes: Subsection (c) still lets the commissioner run a state store where a zone has no licensed outlet; that none does today is not stated in the excerpt.
