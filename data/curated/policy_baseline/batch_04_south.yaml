  - id: base_fl_grocery_spirits
    geo_id: "state:12"
    dimension: ordinary_grocery_spirits_authorization
    value: conditional_or_special_channel
    detail: Spirits are sold off-premises by package-store vendors whose premises must be devoted exclusively to alcoholic beverages and have no opening into any other building or room, so a grocery can sell spirits only through a separate store.
    asset:
      asset_id: law_fl_stat_565_04
      url: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0565/Sections/0565.04.html
      edition: "2026 Florida Statutes § 565.04 (Package store restrictions), Florida Legislature page"
      filename: fl_stat_565_04.html
      rights_status: government_edict
    citation: Fla. Stat. § 565.04(1)
    locator: subsection (1)
    find:
      - "Vendors licensed under s. 565.02 (1)(a) shall not in said place of business sell, offer, or expose for sale any merchandise other than such beverages, and such places of business shall be devoted exclusively to such sales"
      - "Such places of business shall have no openings permitting direct access to any other building or room, except to a private office or storage room of the place of business from which patrons are excluded."
    evidence_strength: current_code
    support: indirect
    notes: The section restricts package stores; that a grocery therefore sells spirits only through a separate adjoining store is inferred, not stated.
  - id: base_fl_spirits_retail
    geo_id: "state:12"
    dimension: spirits_off_premise_retail_system
    value: private_licensed
    detail: Privately licensed package-store vendors.
    asset:
      asset_id: law_fl_stat_565_02
      url: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0565/Sections/0565.02.html
      edition: "2026 Florida Statutes § 565.02 (License fees; vendors), Florida Legislature page"
      filename: fl_stat_565_02.html
      rights_status: government_edict
    citation: Fla. Stat. § 565.02(1)(a)
    locator: subsection (1)(a)
    find: "(a) A vendor operating a place of business where beverages are sold only in sealed containers for consumption off the premises where sold shall pay an amount equal to 75 percent of the amount of the license tax for vendors in the same county"
    evidence_strength: current_code
