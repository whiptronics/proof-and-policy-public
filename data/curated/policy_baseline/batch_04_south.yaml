# Nationwide policy baseline, batch 4: the South (first part). Each entry is a dated snapshot of what the cited
# text shows on the day it was read; nothing here covers other days.
# support: explicit_text (default) | no_outlet_restriction | indirect (see batch_02_west.yaml).
#
# Not in this batch, and why (see data/curated/research/source_leads.csv):
#   Texas: statutes.capitol.texas.gov now serves every code page through a script application; a plain request
#     returns the same 250 KB shell for any chapter.
#   Delaware: delcode.delaware.gov returned a page with no statute text for title 4, chapter 5.
#   Oklahoma, Alabama, Mississippi, Maryland: not fetched in this pass (official texts identified as leads;
#     Mississippi's code is published by a commercial host, and Maryland's rules differ county by county).
batch: batch_04_south
