  # ------------------------------------------------------------------ Nevada
  - id: base_nv_grocery_wine
    geo_id: "state:32"
    dimension: ordinary_grocery_wine_authorization
    value: authorized
    detail: State law leaves retail liquor licensing to county liquor boards (and to cities within their limits) and names no outlet type.
    asset:
      asset_id: law_nv_nrs_244
      url: https://www.leg.state.nv.us/NRS/NRS-244.html
      edition: "Nevada Revised Statutes chapter 244 (Counties: government), Nevada Legislature page"
      filename: nv_nrs_244.html
      rights_status: government_edict
    citation: NRS 244.350
    locator: subsections 1 and 2
    find:
      - "The liquor board may, without further compensation, grant or refuse liquor licenses, and revoke those licenses whenever there is, in the judgment of a majority of the board, sufficient reason for revocation."
      - "(a) Regulating the sale of intoxicating liquors in their respective counties."
    evidence_strength: current_code
    support: no_outlet_restriction
    notes: >-
      Which outlets may sell is set by county and city ordinances (local implementation, not coded). Subsection 4
      exempts dealers within incorporated cities from the county license. NRS 369.090 defines a retail liquor
      store without naming outlet types.
