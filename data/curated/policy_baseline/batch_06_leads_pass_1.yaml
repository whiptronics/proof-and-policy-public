  # ------------------------------------------------------------------ Delaware
  # The official title 4 PDF says it includes all acts enacted as of 2026-09-10. It carries several dated
  # versions of some sections; the first version of each in the file is the one in force on the day it was
  # read (2026-10-08): § 101 [Effective until Oct. 21, 2026] and § 516 [Effective until Oct. 21, 2026].
  # Later versions (from 2026-10-21, 2027-01-23 and 2029-07-23) are not coded.
  - id: base_de_grocery_wine
    geo_id: "state:10"
    dimension: ordinary_grocery_wine_authorization
    value: not_authorized
    detail: Off-premises licenses go to package stores, and the Code's definition of a package store excludes grocery stores, convenience stores and drug stores.
    asset:
      asset_id: law_de_code_title_4
      url: https://delcode.delaware.gov/title4/title4.pdf
      edition: "Delaware Code title 4 (Alcoholic Liquors and Marijuana), official PDF including acts enacted as of 2026-09-10"
      format: pdf
      rights_status: government_edict
    citation: 4 Del. C. §§ 101(35) and 516(a)(1)a. (versions effective until 2026-10-21)
    locator: § 101 paragraph (35); § 516 paragraph (a)(1)a.
    find:
      - text: "Any person in charge of a package store whether owner, lessee, or manager, and recognized as such by the Commissioner, may apply to the Commissioner for a license to purchase from an importer and to keep and sell and deliver on the premises only spirits, wine, or beer"
        after: '§ 516 Consumption off the premises of a package store, hotel, restaurant, club, or taproom [Effective until Oct. 21, 2026]'
        before: '§ 516 Consumption off the premises'
      - text: '"Package store" or "store" does not include a grocery store, convenience store, drug store, hotel, restaurant, club, delicatessen, tobacco retailer, or cigar store.'
        after: '§ 101 Definitions [Effective until Oct. 21, 2026]'
        before: '§ 101 Definitions [Effective Oct. 21, 2026]'
    evidence_strength: current_code
    support: indirect
    notes: >-
      Section 516 also keeps some pre-1983 restaurant and taproom off-premises licenses, which are not a grocery
      route. That a grocery store cannot sell wine follows from the two provisions together. The version of
      § 101 effective 2026-10-21 still excludes grocery stores from "package store"; the § 516 versions effective
      later were not compared.
