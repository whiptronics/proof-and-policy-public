  - id: base_az_grocery_wine
    geo_id: "state:04"
    dimension: ordinary_grocery_wine_authorization
    value: authorized
    detail: An off-sale retailer includes any established retail store that sells other commodities; the beer and wine store license is an off-sale retailer's license to sell beer and wine.
    asset:
