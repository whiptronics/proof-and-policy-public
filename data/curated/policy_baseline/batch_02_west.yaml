      edition: "Arizona Revised Statutes § 4-101 (Definitions), Arizona Legislature page"
      rights_status: government_edict
    citation: A.R.S. § 4-101
    locator: paragraph 31 ("Off-sale retailer")
    find: '"Off-sale retailer" means any person that operates a bona fide regularly established retail liquor store that sells spirituous liquors, wines and beer and any established retail store that sells commodities other than spirituous liquors and that is engaged in the sale of spirituous liquors only in the original unbroken package'
    evidence_strength: current_code
    support: no_outlet_restriction
    notes: The beer and wine store license is defined in A.R.S. § 4-209 (snapshot base_az_grocery_beer).
