  - id: base_id_grocery_wine
    geo_id: "state:16"
    dimension: ordinary_grocery_wine_authorization
    value: authorized_local_option
    detail: Retail wine licenses (table and dessert wine, off-premises) are issued only in counties whose commissioners or voters permit retail wine sales; no outlet type is named or excluded.
    asset:
      asset_id: law_id_23_1304
      url: https://legislature.idaho.gov/statutesrules/idstat/Title23/T23CH13/SECT23-1304
      edition: "Idaho Code § 23-1304 (County option), Idaho Legislature page"
      filename: id_23_1304.html
      rights_status: government_edict
    citation: Idaho Code § 23-1304
    locator: subsection (a)
    find: "(a) the board of county commissioners of each county of this state may, by resolution regularly adopted, provided that retail sale of table wine and/or dessert wine, as defined in this chapter, shall be permitted within the county, and upon a certification of such resolution to the director, a retail wine license shall thereafter be issued for premises within such county so long as such resolution remains in effect"
    evidence_strength: current_code
    support: no_outlet_restriction
    notes: >-
      The retail wine license is defined in Idaho Code § 23-1303(l). Which counties have adopted the option is
      not recorded here (grocery_wine_local_adoption_share). Wine over 16% alcohol is sold through the state
      liquor system (§ 23-203(b)). The Legislature's site says statutes are updated to the website July 1
      following each session.
