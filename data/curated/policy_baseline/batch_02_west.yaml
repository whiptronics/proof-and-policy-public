# Nationwide policy baseline, batch 2: western states. Each entry is a dated snapshot: the status the cited
# text shows on the day it was read, or on the date or year the source states for itself. Nothing here says
# anything about other days.
#
# support: explicit_text (default) when the excerpt names the outlet type or arrangement;
# no_outlet_restriction when it creates a general retail license and the outlet type's eligibility is
# inferred from the absence of a restriction; indirect when the text implies the status without stating it.
#
# Not in this batch, and why (see data/curated/research/source_leads.csv):
#   Alaska: the statutes site (akleg.gov/basis/statutes.asp) serves the text through scripts; a plain request
#     returned an empty shell, so no excerpt could be cut from pinned bytes.
#   Nevada: retail licensing is by counties and cities; the state chapter (NRS 369) defines a retail liquor
#     store but no state license names an outlet type. Needs the county and city licensing provisions.
#   Colorado current code: the General Assembly links to LexisNexis for current statutes; the agency's
#     bulletins (sbg.colorado.gov) returned 403. Colorado is coded from the 2024 annual printout only.
batch: batch_02_west
extracted_by: Claude (AI assistant); excerpts cut from the pinned bytes by scripts/policy_snapshots.py
extracted_on: "2026-10-08"
