  # ------------------------------------------------------------------ Kentucky
  - id: base_ky_grocery_wine
    geo_id: "state:21"
    dimension: ordinary_grocery_wine_authorization
    value: not_authorized
    detail: No package license for wine or distilled spirits at premises where staple groceries or gasoline are a substantial part of sales.
    asset:
      asset_id: law_ky_krs_243_230
      url: https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=45959
      edition: "Kentucky Revised Statutes 243.230 (effective June 29, 2017), Legislative Research Commission"
      filename: krs_243_230.pdf
      format: pdf
      rights_status: government_edict
    citation: KRS 243.230
    locator: subsection (5)
    find: "No quota retail package license or quota retail drink license for the sale of distilled spirits or wine shall be issued for any premises used as or in connection with the operation of any business in which a substantial part of the commercial transaction consists of selling at retail staple groceries or gasoline and lubricating oil."
    evidence_strength: current_code
    notes: >-
      'Substantial part' is defined in an administrative regulation (804 KAR 4:270, not pinned here). Chains can
      operate separately licensed package stores next to their grocery stores; that is not an ordinary grocery
      license.
