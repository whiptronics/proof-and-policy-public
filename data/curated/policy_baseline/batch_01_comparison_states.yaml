    detail: The Alcoholic Beverage Control Board operates government stores for spirits, staffed by its employees.
    asset:
      asset_id: law_va_4_1_119
      url: https://law.lis.virginia.gov/vacode/title4.1/chapter1/section4.1-119/
      edition: "Code of Virginia § 4.1-119 (Operation of government stores), Virginia Law Library page"
      rights_status: government_edict
      options: {normalize: strip_lis_page_variants}
    citation: Code of Virginia § 4.1-119 (version effective until July 1, 2028)
    locator: subsections A and D
