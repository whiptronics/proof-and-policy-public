  # ------------------------------------------------------------------ Maryland (statute text; the General Assembly's pages serve it)
  - id: base_md_grocery_wine
    geo_id: "state:24"
    dimension: ordinary_grocery_wine_authorization
    value: chains_and_supermarkets_barred
    detail: >-
      A local licensing board may not issue a Class A (off-sale), B or D beer and wine license for use at a chain
      store, supermarket or discount house; establishments already licensed and licensees selling at discount
      prices are exempt. Other grocery stores are not barred by this section.
    asset:
      asset_id: law_md_gab_4_205
      url: https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=gab&section=4-205&enactments=false
      edition: "Maryland Code, Alcoholic Beverages and Cannabis Article § 4-205, General Assembly statute text page"
      filename: md_gab_4_205.html
      rights_status: government_edict
    citation: Md. Code, Alcoholic Beverages and Cannabis § 4-205
    locator: subsections (a) and (b)
    find:
      - "A local licensing board may not issue a Class A, Class B, or Class D beer license, beer and wine license, or beer, wine, and liquor license for use in conjunction with or on the premises of"
      - "a chain store; (2) a supermarket; or (3) a discount house"
      - "an establishment that already holds a Class A, Class B, or Class D beer license, beer and wine license, or beer, wine, and liquor license"
    evidence_strength: current_code
    notes: >-
      The subtitle applies statewide subject to Division II of the Article (§ 4-201), whose county titles were not
      surveyed, so county rules may differ. "Chain store", "supermarket" and "discount house" were not looked up in
      the definitions. Bills to add a food-retailer exception (§ 4-205.1; 2024 HB 847 and SB 1139, 2025 HB 1379,
      2026 HB 1303) were found by search; § 4-205.1 does not exist on the General Assembly's site (checked
      2026-10-09).
