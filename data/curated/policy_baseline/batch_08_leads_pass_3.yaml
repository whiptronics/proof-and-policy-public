    asset: law_ms_dor_abc_faq
    citation: Mississippi Department of Revenue, Tobacco, Beer and Alcohol FAQs
    locator: answer on beer, light wine and alcoholic beverages
    find: "Likewise, alcoholic beverages cannot be sold in convenience or grocery stores. An alcoholic beverage is either a distilled spirit that contains more than 6% alcohol by weight or a wine product that contains more than 5% alcohol by weight."
    evidence_strength: agency_guidance
  - id: base_ms_grocery_beer
    geo_id: "state:28"
    dimension: ordinary_grocery_beer_authorization
    value: authorized
    detail: Beer (up to 8% by weight), light wine and light spirits are kept out of package stores and sold by retail beer permittees such as grocery and convenience stores.
    asset: law_ms_dor_abc_faq
    citation: Mississippi Department of Revenue, Tobacco, Beer and Alcohol FAQs
    locator: answer on beer, light wine and alcoholic beverages
    find: "Beer, light wine, and light spirits cannot be sold in package stores. Likewise, alcoholic beverages cannot be sold in convenience or grocery stores."
    evidence_strength: agency_guidance
    support: indirect
    notes: That grocery stores sell beer is implied by the contrast ("Likewise") rather than stated.
