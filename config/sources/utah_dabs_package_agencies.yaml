update_frequency: Revised with each package agency contract cycle (fiscal year)
source_family: finance
rights_status: facts_with_citation
notes: >-
  Package agencies are private businesses (Type 2: run with another business whose main income is not liquor, such
  as a convenience store; Type 3: small, mostly rural, mainly selling liquor) that sell liquor under contract at the
  price the commission fixes (Utah Code 32B-2-605(7)), paid a fixed
  annual amount by annual bottles sold and average bottle price. scripts/dabs_package_agency_grid.py reads the
  one-page grid from the PDF's own table into web/src/lib/packageAgencyGrid.generated.ts, and a test fails when the
  two differ. The PDF is not redistributed.
