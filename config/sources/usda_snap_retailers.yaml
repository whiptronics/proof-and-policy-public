notes: >-
  Used as the list of Utah grocery stores because it is public, geocoded and classifies store types; a grocery store
  that does not accept SNAP is missing from it. FNS store types are FNS's own, not Census's NAICS 445110 (County
  Business Patterns counts 411 grocery establishments in Utah). Convenience stores, "Other" and specialty stores are
  left out, as the framework's first phase leaves them out.
