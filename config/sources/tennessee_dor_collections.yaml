source_id: tennessee_dor_collections
publisher: Tennessee Department of Revenue
title: Summary of Collections (monthly; June editions close each fiscal year)
landing_url: https://www.tn.gov/revenue/tax-resources/tax-collections-information.html
citation: >-
  Tennessee Department of Revenue. Summary of Collections, June editions, fiscal years 2010-2025.
  https://www.tn.gov/revenue/tax-resources/tax-collections-information.html
update_frequency: Monthly; the June edition reports the fiscal year (July-June) to date
source_family: finance
rights_status: facts_with_citation
notes: >-
  Collections by account code, as received (collections basis), before any distribution to local
  governments. Only the fiscal-year-to-date page of each June edition is read, and only its current-year
  column, so each fiscal year has one value from the report that closed it. Parsed from the PDF text layer by
  adapters/tn_dor_collections.py; every ALCOHOLIC BEVERAGES class must add up to its printed TOTAL. Account
  11002 is printed "Wine Tax" through FY2017 and "Wine Tax & High Alcohol Beer" from FY2018; the two labels
  are separate measures. No account isolates wine sold by retail food stores. The PDFs are not
  redistributed; only the extracted figures and page citations are. Added for the research dashboard's
  worked example on 2026-10-07.
host_min_interval_seconds: 5
