notes: >-
  Audited statements of the State of Utah, including the Alcoholic Beverage Services Fund (the enterprise fund of the
  Department of Alcoholic Beverage Services). Read by hand for the fund's statement of revenues, expenses and
  changes in net position, its notes, and the management's discussion. Values are transcribed into
  data/curated/manual_observations.csv with page citations; the PDFs are not redistributed.
