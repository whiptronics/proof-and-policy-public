source_id: utah_dabs_sales_analysis
publisher: Utah Department of Alcoholic Beverage Services (DABS)
title: Sales Analysis Report (monthly; gross sales and 9-liter case sales by product)
landing_url: https://abs.utah.gov/
citation: >-
  Utah Department of Alcoholic Beverage Services. Sales Analysis Report, monthly editions fiscal year 2025
  period 11 (May 2025) to fiscal year 2027 period 2 (August 2026). Spreadsheets downloaded by the project
  owner on 2026-10-09. https://abs.utah.gov/
update_frequency: Monthly (one report per fiscal period; period 1 is July)
source_family: finance
rights_status: facts_with_citation
notes: >-
  One row per product with its DABS class code and class name, gross sales in dollars and sales in
  9-liter case equivalents for the month; every report's rows add up exactly to its printed totals (checked
  by the adapter). Gross sales are statewide shelf prices times bottles sold: for products with ten or more
  bottles in a month, 88% divide to a whole number of cents (validation check
  dabs_monthly_gross_sales_at_shelf_prices; 2026-10-11). Whether the shelf prices include sales tax is not
  stated by DABS and is unresolved (docs/fiscal-reconciliation.md). Products are grouped into beverage types
  through metadata/dabs_class_beverage_map.csv,
  which follows DABS's own class names and department groups. Cider is kept apart (DABS files it with beer;
  federal law taxes most cider as wine), and so are premixed drinks (spirit or wine base not stated). The
  reports do not say what share went to licensees (restaurants, bars) rather than shoppers. DABS's annual report line "Revenue from Liquor Sales" (unaudited) is a separate
  figure and is never added to these. The exact download page was not recorded. The spreadsheets are not
  redistributed; only the totals by beverage type are.
host_min_interval_seconds: 10
