source_id: utah_session_laws
publisher: Utah State Legislature (Office of Legislative Research and General Counsel)
title: Utah session laws 2002-2013 (Digests of Legislation, passed-bill indexes, enrolled bills)
landing_url: https://le.utah.gov/
citation: >-
  Utah State Legislature. Digest of Legislation (2003-2014 editions); Passed Bills by session; enrolled bills
  and bill status pages. https://le.utah.gov/
update_frequency: Fixed historical records (the pages' site navigation may change)
source_family: policy
rights_status: government_edict
notes: >-
  Evidence for Utah law before 2014-01-01, where the Historical Code begins: Title 32B from its 2011-07-01
  commencement (2010 S.B. 167, Laws of Utah 2010 ch. 276), and the beer tax (59-15-101) from 2003 S.B. 66
  (ch. 307, effective 2003-05-05). Each Digest lists every bill enacted in the
  sessions it covers, with the code sections affected, effective date and session-law chapter; each
  passed-bills index lists the same bills with their chapters, and the two are cross-checked session by
  session. Enrolled bills mark inserted text <u> and deleted text [<strike>]; both the text before and after
  each amendment are read from them. Parsed by src/alcohol_data/legal/utah_session_laws.py
  ('alcohol-data legal ledger-utah').
host_min_interval_seconds: 2
assets:
