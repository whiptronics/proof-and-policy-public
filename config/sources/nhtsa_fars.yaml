source_id: nhtsa_fars
publisher: National Highway Traffic Safety Administration (NHTSA), National Center for Statistics and Analysis
title: Fatality Analysis Reporting System (FARS) national files, and NHTSA's state alcohol-impaired-driving estimates
landing_url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
citation: 'National Highway Traffic Safety Administration, Fatality Analysis Reporting System (FARS), national CSV
  files 2000-2023; NHTSA, State Alcohol-Impaired-Driving Estimates: 2022 Data (DOT HS 813 579).'
update_frequency: Annual; a year's annual report file is later replaced by a final file
source_family: safety
rights_status: public_domain_us_federal
rights_evidence_url: https://www.nhtsa.gov/about-nhtsa/website-policies
notes: Census of fatal motor vehicle crashes on public roads. Deaths are counted in the state where the crash happened.
  Alcohol-impaired-driving fatalities follow NHTSA's definition (a driver with BAC .08 g/dL or more) using NHTSA's
  ten multiple imputations of unreported BACs (MIDRVACC.CSV), averaged. The published report's values are kept as
  separate measures and compared in validation.
host_min_interval_seconds: 2
