source_id: census_trade_margins
publisher: U.S. Census Bureau
title: Annual Retail Trade Survey and Annual Wholesale Trade Survey, gross margin as a percent of sales
landing_url: https://www.census.gov/data/tables/2022/econ/arts/2022benchmarked/annual-report.html
citation: >-
  U.S. Census Bureau. Annual Retail Trade Survey, 2022 (benchmarked): "Estimated Annual Gross Margin as a Percentage of
  Sales of U.S. Retail Firms by Kind of Business: 1993-2022" (gmper.xlsx). Annual Wholesale Trade Survey, 2022
  (revised): "Table 4. Estimated Annual Purchases, Gross Margins, and Gross Margins as a Percent of Sales for U.S.
  Merchant Wholesalers, Except Manufacturers' Sales Branches and Offices: 1992 Through 2022"
  (2022_awts_purchmarg_nomsbo_table4.xlsx). https://www2.census.gov/programs-surveys/arts/tables/2022benchmarked/ and
  https://www2.census.gov/programs-surveys/awts/tables/2022revised/
update_frequency: Annual (each release revises earlier years and is benchmarked to the latest Economic Census)
source_family: finance
rights_status: public_domain_us_federal
rights_evidence_url: https://www.census.gov/about/policies/open-gov/open-data.html
notes: >-
  National industry averages across every product the businesses sell, as a percent of their sales. Census defines
  gross margin as sales less cost of goods sold (beginning inventory plus purchases for resale less ending inventory);
  retail sales exclude sales taxes collected from customers and include excise taxes paid by the manufacturer or
  wholesaler and passed along (ARTS glossary, read 2026-10-15). A gross margin is not a markup, a net profit or an
  incremental cost; the project uses these figures only as reference assumptions for what private sellers keep, never
  as a measured minimum a Utah grocer would need on wine. The rows for the industries the grocery-wine comparison
  refers to are parsed from the pinned workbooks by src/alcohol_data/adapters/census_trade_margins.py, every year
  printed, with each cell's reference (nation:us, calendar data years): retail total, food and beverage stores (445),
  grocery stores (4451), beer, wine and liquor stores (4453), warehouse clubs and supercenters (452311); merchant
  wholesale total (42), grocery wholesalers (4244), beer, wine and distilled alcoholic beverage wholesalers (4248).
host_min_interval_seconds: 5
