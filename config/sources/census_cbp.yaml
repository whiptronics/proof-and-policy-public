source_id: census_cbp
publisher: U.S. Census Bureau
title: County Business Patterns, state files (alcohol retail, drinking places, supermarkets)
landing_url: https://www.census.gov/programs-surveys/cbp.html
citation: U.S. Census Bureau, County Business Patterns, state-level files, 2000-2023. https://www.census.gov/programs-surveys/cbp.html
update_frequency: Annual (about 18 months after the reference year)
source_family: context
rights_status: public_domain_us_federal
rights_evidence_url: https://www.census.gov/about/policies/open-gov/open-data.html
notes: 'Private employers only: government establishments, including state-run liquor stores, are out of scope.
  NAICS 445310 (beer, wine and liquor stores), 722410 (drinking places) and 445110 (supermarkets and other grocery
  stores) keep their codes across the NAICS 1997-2017 editions these years use; the edition is recorded with each
  value. Employment is disclosure-protected and its method changes in 2007 (noise added) and 2017 (no more withheld
  cells); see the adapter''s docstring.'
host_min_interval_seconds: 1
