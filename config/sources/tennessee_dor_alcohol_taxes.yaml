notes: >-
  The department's own manual of who pays Tennessee's alcoholic beverage taxes and at what rate. The June 2025 edition
  is the one that closed Tennessee's FY2025. The tax overview page (tn.gov/revenue/taxes/alcoholic-beverage-taxes.html)
  answered automated requests with HTTP 403 on 2026-11-20. Read for the Public
  Funding page's comparison of Utah, Tennessee and Colorado (devplan item PPF-407, 2026-11-20): the tax base wine
  sold by Tennessee food stores pays. It is the department's guidance, not the Tennessee Code itself.
