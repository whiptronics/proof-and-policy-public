source_id: virginia_legislature
publisher: Virginia General Assembly, Division of Legislative Automated Systems (Legislative Information System)
title: Virginia Acts of Assembly amending Code of Virginia §§ 4.1-209 and 4.1-206.3 (wine and beer retail licenses),
  1997-2024
landing_url: https://legacylis.virginia.gov/
citation: Acts of Assembly of the Commonwealth of Virginia, chapters as published on the Legislative Information
  System (legacylis.virginia.gov), 1997-2024; Code of Virginia pages, Virginia Law Library (law.lis.virginia.gov).
update_frequency: Each session; enacted chapters do not change
source_family: policy
rights_status: government_edict
notes: Each chapter reprints the sections it amends, with insertions in italics (<i>) and deletions struck through
  (<s>). The version ledger (metadata/legal_history/state_section_versions.csv) reads the text before and after
  each act from that markup (convention va_lis_html_italic_strike). The chapters are the ones named in the history
  notes of § 4.1-209 (an archived 2017 page and the current page) and of § 4.1-206.3; 2020 chapters 15, 16, 32,
  34, 400 and 1009, also in § 4.1-206.3's note, amend other sections that the 2020 recodification folded into it
  and do not print § 4.1-206.3. The 2026 chapters are on the new LIS only, which is a script application; the 2026
  text comes from the current code page.
host_min_interval_seconds: 3
