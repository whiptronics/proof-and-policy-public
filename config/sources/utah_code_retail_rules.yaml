notes: >-
  Cited by the same-shelf-price page: a state store (§ 32B-2-503(2)) and a package agency (§ 32B-2-605(7)) may sell
  liquor only at a price fixed by the commission, and neither may sell on Sunday or a state or federal legal holiday
  (§ 32B-2-503(5)(a); § 32B-2-605(13)), subject to the exceptions those subsections state.
