notes: >-
  Read by hand for one fact used by the Utah revenue scenario tool: the state sales and use tax rate, the
  state's own part of the combined rate (page 6, "Chart 2: Taxes in the Combined Rate"). The same page
  gives a lower state rate for grocery food, and page 3 says grocery food does not include alcoholic
  beverages. Local option, county and other parts of the combined rate go to local governments and are
  not used. Every page is marked as a draft pending a public meeting, so the figure is labelled that way
  wherever it is shown. The exact download URL was not recorded. The PDF is not redistributed.
