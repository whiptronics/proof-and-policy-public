notes: >-
  The amount the law sets for each classroom teacher's supplies and materials: $500 a year for pre-kindergarten special
  education and kindergarten through grade 6, $250 for grades 7 through 12, which the State Board of Education may
  reduce in proportion when the appropriation falls short. Supplies only, not a classroom's whole budget. Read
  2026-11-21 for the Public Funding page's public-value scale (devplan item PPF-404).
