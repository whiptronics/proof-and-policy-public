notes: >-
  Utah school fiscal years run July to June: FY2024 is July 1, 2023 to June 30, 2024. That is the same year Census's
  FY2024 Annual Survey of School System Finances covers for Utah, and it is not a federal fiscal year (October to
  September). USBE's per-pupil figure divides by fall enrollment under its own definition of current expenditures,
  so it is a second measure beside Census's, not the same number.
