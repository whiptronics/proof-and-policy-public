# Individual Unit Files, FY2015-FY2024. Saved by Ethan from a browser into ../Repeal Title 32B Utah and imported
# with 'alcohol-data import-asset' on 2026-10-12 (the originals stay in that folder; www2.census.gov refuses this
# environment). Each zip holds the unit file (<year>FinEstDAT_*.txt, every item of every government in the
# sample), the government directory (Fin_GID_<year>.txt to FY2016, Fin_PID_<year>.txt from FY2017), the
# state-by-level file (<yy>statetypepu.txt, same layout as the files above) and the Technical Documentation PDF.
# Parsed by census_unit_liquor_stores 1.0 (2026-10-13): the 50 state government records (type digit 0), each checked
# against its state's name in the directory, its fiscal-year end and the state-by-level file's level 2 lines. What
# the files contain, the layout change at FY2017, the FY2015 revisions and the new comparability groups (capital
# outlay and total expenditure from FY2022; Oregon's current operations and total expenditure) are in
# docs/fiscal-reconciliation.md ("After FY2015").
# FY2015 has priority 15, below the FY2015 state-by-type file (20): the zip carries a later Census release of FY2015
# that changes seven states (Oregon's revenue doubles), so the 2017 release stays preferred and this one is kept
# as a competing candidate.
  - asset_id: census_govfin_unit_fy2015
