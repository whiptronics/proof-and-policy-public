citation: >-
  U.S. Census Bureau, Annual Survey of State and Local Government Finances and Census of Governments.
  Historical Finances of Individual Governments, fiscal years 1967 and 1970-2012 (_IndFin_1967-2012.zip,
  February 2015), the state-by-type-of-government public-use files for fiscal years 2008-2015, and the
  Individual Unit Files (public use) for fiscal years 2015-2024.
  https://www2.census.gov/programs-surveys/gov-finances/datasets/
update_frequency: Annual survey; the historical database is a fixed archive (February 2015)
source_family: finance
rights_status: public_domain_us_federal
rights_evidence_url: https://www.census.gov/about/policies/open-gov/open-data.html
notes: >-
  Only the liquor store items of state governments are read: revenue (Census code A90) and expenditure
  (total, current operations E90, capital outlay F90 + G90), in thousands of current dollars. Census
  defines liquor stores as "alcoholic beverage distribution facilities operated by governments maintaining
  alcoholic beverage monopoly systems", so a wholesale-only monopoly (Mississippi, Wyoming, Michigan after
  its stores closed) has liquor store revenue too: a value never says that the state runs retail stores,
  and a zero never says it does not. Revenue "excludes any taxes collected by the system" (Glossary of
  Government Finances, 1992, in the IndFin zip); expenditure includes the purchase of liquor for resale.
  Census publishes no profit or transfer item, and the IndFin readme warns that a difference between
  revenue and expenditure "does not necessarily indicate a budget surplus or deficit", so none is
  computed here. Local government liquor stores (municipal and county ABC stores) are not read. The
  state-by-type files carry no layout document of their own; each line is read as Census state code, type
  digit (2 = state government), item code, amount in thousands, coefficient of variation and year,
  because on that reading every state government liquor item for FY2008-FY2012 equals the IndFin record
  (checked 2026-10-08, and kept as the validation check reconcile_census_liquor_store_files). The Technical
  Documentation in the FY2015-FY2024 unit zips documents the same layout (level code 2 = "State government
  total"); from FY2017 its state codes are FIPS codes, not Census codes.
host_min_interval_seconds: 2
