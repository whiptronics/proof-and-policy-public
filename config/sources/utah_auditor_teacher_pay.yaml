notes: >-
  The auditor's teacher-level compensation report: teachers whose primary role was classroom teaching and who matched a
  teacher ID in USBE's CACTUS database, from district and charter compensation reports. "Total Compensation" includes
  benefits and also pay from non-instructional roles; "Instructional Wages" is pay for teaching only. The dashboard is
  an R Shiny app with no fixed download address, so the file was downloaded from its "Download as CSV" button after
  choosing "Total Compensation" with every other filter at its default (fiscal year 2025, all districts and charter
  schools), and imported by hand. It names individual teachers; the raw file is kept here, not redistributed, and only
  the statewide average is published. One row per teacher per school repeats that teacher's pay, so the average counts
  each teacher once per district or charter school, which reproduces the dashboard's displayed mean ($116,032).
