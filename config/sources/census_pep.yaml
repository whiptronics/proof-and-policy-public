    url: https://www2.census.gov/programs-surveys/popest/datasets/2010-2020/intercensal/state/asrh/sc-est2020int-alldata6.csv
    edition: "Intercensal Estimates of the Resident Population by Single Year of Age, Sex, Race, and Hispanic Origin for States: 2010-2020 (alldata6)"
    source_series: census_pep_intercensal_2010_2020
    source_vintage: intercensal_2010_2020
    format: csv
    parser: census_pep_alldata6
    priority: 30
    redistribute_raw: true
    notes: Preferred over the 2000-2010 intercensal file for July 1, 2010 (consistent with the 2020 census).
  - asset_id: census_pep_v2025_alldata6
    url: https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/asrh/sc-est2025-alldata6.csv
