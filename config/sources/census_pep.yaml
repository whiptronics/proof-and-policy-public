source_id: census_pep
publisher: U.S. Census Bureau, Population Division
title: Population Estimates Program (PEP) state population estimates
landing_url: https://www.census.gov/programs-surveys/popest.html
citation: "U.S. Census Bureau, Population Estimates Program. State population estimates (intercensal 1990-2000, 2000-2010, 2010-2020; Vintage 2025). https://www.census.gov/programs-surveys/popest.html"
update_frequency: Annual vintages (state age detail usually released in June); intercensal series once per decade
source_family: population
rights_status: public_domain_us_federal
rights_evidence_url: https://www.census.gov/about/policies/open-gov/open-data.html
notes: >-
  July 1 resident population estimates. Intercensal series are revised to be consistent with the
  following census and replace the postcensal vintages for their decade. Different series and vintages
  are stored as separate candidates and never spliced silently; see docs/methods/population.md.
host_min_interval_seconds: 1
assets:
  - &icen90
    asset_id: census_pep_icen_1990
    url: https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1990.txt
    edition: "1990-1999 Intercensal State and County Characteristics Population Estimates (layout dated 2003-06-23)"
    source_series: census_pep_intercensal_1990_2000
    source_vintage: intercensal_1990_2000
    format: text_fixed_width
    parser: census_pep_icen_1990s
    priority: 20
    redistribute_raw: true
    options: {year: 1990}
    notes: State totals are sums of county rows. Five-year age groups do not allow 14+/18+/21+ totals.
  - {<<: *icen90, asset_id: census_pep_icen_1991, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1991.txt", options: {year: 1991}}
  - {<<: *icen90, asset_id: census_pep_icen_1992, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1992.txt", options: {year: 1992}}
  - {<<: *icen90, asset_id: census_pep_icen_1993, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1993.txt", options: {year: 1993}}
  - {<<: *icen90, asset_id: census_pep_icen_1994, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1994.txt", options: {year: 1994}}
