  - {<<: *icen90, asset_id: census_pep_icen_1996, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1996.txt", options: {year: 1996}}
  - {<<: *icen90, asset_id: census_pep_icen_1997, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1997.txt", options: {year: 1997}}
  - {<<: *icen90, asset_id: census_pep_icen_1998, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1998.txt", options: {year: 1998}}
  - {<<: *icen90, asset_id: census_pep_icen_1999, url: "https://www2.census.gov/programs-surveys/popest/tables/1990-2000/intercensal/st-co/stch-icen1999.txt", options: {year: 1999}}
  - asset_id: census_pep_icen_2000s_agesex
    url: https://www2.census.gov/programs-surveys/popest/datasets/2000-2010/intercensal/state/st-est00int-agesex.csv
    edition: "Intercensal Estimates of the Resident Population by Single Year of Age and Sex for States: 2000-2010"
    source_series: census_pep_intercensal_2000_2010
    source_vintage: intercensal_2000_2010
    format: csv
    parser: census_pep_st_agesex_2000s
    priority: 20
    redistribute_raw: true
    notes: STATE codes are published without leading zeros ("1" = Alabama); the adapter pads them. AGE 85 = 85 and over; AGE 999 = total.
