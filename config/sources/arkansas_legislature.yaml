citation: >-
  Acts of Arkansas, Regular Session 2017, Act 508 (SB 284), "An Act to Establish a Retail Off-Premises Permit
  for the Sale of Wine at Grocery Stores" (Arkansas General Assembly PDF).
update_frequency: Each legislative session; enacted acts do not change
source_family: policy
rights_status: government_edict
notes: >-
  Act 508 of 2017 adds Arkansas Code Title 3, Chapter 5, Subchapter 18 (§§ 3-5-1801 to -1803, the grocery
  store wine permit), effective 2017-10-01 by its section 13(a). Arkansas acts mark insertions by
  underlining and deletions by striking through; both are drawn on the page, so the PDF's text layer keeps
  inserted and deleted words alike. Only the new subchapter, which is wholly new text, is read here; the
  amended sections are not rebuilt. Later acts amending the subchapter are not yet inventoried (the free
  Arkansas Code is LexisNexis's script application).
