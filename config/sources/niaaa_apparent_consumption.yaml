notes: >-
  Apparent consumption is computed from beverage sales, shipment or tax-receipt data, not from observing
  what residents drink. Visitor purchases, cross-border shopping and inventory changes affect it.
  Per capita values use NIAAA's own age 14+ and 21+ population denominators.
