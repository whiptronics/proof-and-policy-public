notes: >-
  An experimental Census product. The file gives only the percent change from the same month a year
  earlier, by state, for total retail sales excluding nonstore retailers (code TOTAL) and for eleven
  three-digit NAICS subsectors; it holds no dollar levels, so nothing can be expressed per resident. Food
  and beverage stores (NAICS 445) mix supermarkets with beer, wine and liquor stores; no liquor-store
  detail is published. Values are not seasonally adjusted and not adjusted for trading days, holidays or
  prices (Census notes). The Census maps flag changes whose 90 percent confidence interval includes zero;
  this file carries no such flags, so the dashboard cannot show them. The exact download URL was not
  recorded.
