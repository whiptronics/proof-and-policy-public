source_id: naep_2024
publisher: National Center for Education Statistics (NCES), National Assessment of Educational Progress
title: NAEP 2024 state results, reading and mathematics, grades 4 and 8 (NAEP Data Service)
landing_url: https://www.nationsreportcard.gov/api_documentation.aspx
citation: >-
  U.S. Department of Education, Institute of Education Sciences, National Center for Education Statistics, National
  Assessment of Educational Progress (NAEP), 2024 Reading and Mathematics Assessments, retrieved from the NAEP Data
  Service (GetAdhocData). https://www.nationsreportcard.gov/api_documentation.aspx
update_frequency: Every two years for reading and mathematics (2024 is the latest state results)
source_family: context
rights_status: public_domain_us_federal
notes: >-
  Average scale scores for all students in public schools, each state, the District of Columbia and the national
  public sample. The sig files are NCES's own significance tests between jurisdictions (sigacrossjuris); the page
  reports a state as above or below the nation only where NCES's test says so, never from the point estimates alone.
  Outcome measures, not spending measures; nothing here estimates how money affects scores.
host_min_interval_seconds: 3
