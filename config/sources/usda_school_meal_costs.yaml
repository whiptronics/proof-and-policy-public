notes: >-
  A nationally representative study of what school meals cost to produce in school year 2014-15. "Reported cost" is
  what school food authorities charge to food service; "full cost" adds costs the district carries but does not charge
  to food service. The Public Funding page uses the full cost of a lunch weighted by lunches served (each lunch counts
  once), national, in 2014-15 dollars, without inflating it. Read 2026-11-21 for the page's public-value scale (devplan
  item PPF-404); no Utah-specific or later cost per meal was found.
