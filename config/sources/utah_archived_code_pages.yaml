publisher: Utah State Legislature (code pages as captured by the Internet Archive's Wayback Machine)
title: Utah Code Title 32A section pages, 2008 and 2010, from the Internet Archive
landing_url: https://web.archive.org/
citation: >-
  Utah State Legislature, Utah Code section pages (le.utah.gov/~code/TITLE32A/), as captured by the Internet
  Archive Wayback Machine on 2008-07-10 and 2010-07-29. https://web.archive.org/
update_frequency: Fixed captures
source_family: policy
rights_status: government_edict
notes: >-
  The Legislature's own Utah Code pages for Title 32A sections, as they were published while Title 32A was in
  force, kept by the Internet Archive. Each page gives the section's text, its history note and a "Last
  revised" date. They supply the text of Title 32A sections that no 2003-2010 bill printed (32A-12-202,
  32A-3-104) and an independent print against which the sections rebuilt from session laws are checked.
  Captures are requested in their original form (the "id_" address) one at a time, ten seconds apart.
  Parsed by src/alcohol_data/legal/utah_archived_code.py.
host_min_interval_seconds: 10
