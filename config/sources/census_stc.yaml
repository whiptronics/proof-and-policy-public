title: Annual Survey of State Government Tax Collections (STC)
landing_url: https://www.census.gov/programs-surveys/stc.html
citation: "U.S. Census Bureau. Annual Survey of State Government Tax Collections. STC Historical Database (2025 release) and FY2023-FY2025 flat files. https://www.census.gov/programs-surveys/stc.html"
update_frequency: Annual (April release, revising the two prior years)
source_family: finance
rights_status: public_domain_us_federal
rights_evidence_url: https://www.census.gov/about/policies/open-gov/open-data.html
notes: >-
  State-government collections only (not state plus local). Thousands of current dollars, state fiscal
  years. T10 excludes profits of state-operated liquor stores, which Census classifies as liquor store
  revenue. See docs/fiscal-reconciliation.md.
host_min_interval_seconds: 1
